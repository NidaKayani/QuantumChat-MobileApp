name: quantumchat
description: QuantumChat mobile messenger — same E2E backend as the web app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  socket_io_client: ^3.0.2
  pinenacl: ^0.6.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.3
  provider: ^6.1.2
  file_picker: 8.1.7
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  intl: ^0.20.2
  image_picker: ^1.1.2
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
